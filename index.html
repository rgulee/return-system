<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>電商退貨管理系統</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #4f8ef7;
    --accent2: #f7c94f;
    --green: #3ecf8e;
    --red: #f76f6f;
    --text: #e8eaf6;
    --muted: #7c82a3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .header-icon {
    width: 42px;
    height: 42px;
    background: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .header h1 { font-size: 17px; font-weight: 900; }

  .header .sub {
    font-size: 10px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }

  .header-stats { margin-left: auto; text-align: right; }

  .stat-num {
    font-size: 24px;
    font-weight: 900;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    line-height: 1;
  }

  .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .card-top-bar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 14px 14px 0 0;
  }

  .card-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1.5s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .5; transform: scale(.8); }
  }

  .scan-btn {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(79,142,247,0.15), rgba(79,142,247,0.05));
    border: 2px dashed rgba(79,142,247,0.4);
    color: var(--accent);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.2s;
  }

  .scan-btn:hover { background: rgba(79,142,247,0.2); border-color: var(--accent); }
  .scan-btn:active { transform: scale(0.98); }
  .scan-btn-icon { font-size: 24px; }

  .camera-wrap {
    display: none;
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 4 / 3;
    margin-bottom: 10px;
  }

  .camera-wrap.active { display: block; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #canvas { display: none; }

  .scan-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .scan-frame {
    width: 60%;
    aspect-ratio: 1;
    border: 2px solid var(--accent);
    border-radius: 12px;
    box-shadow: 0 0 0 1000px rgba(0,0,0,0.45);
    position: relative;
  }

  .scan-line {
    position: absolute;
    left: 4px;
    right: 4px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scanline 2s linear infinite;
    top: 0;
  }

  @keyframes scanline {
    0% { top: 4px; }
    100% { top: calc(100% - 4px); }
  }

  .scan-hint {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.7);
  }

  .stop-btn {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    margin-bottom: 10px;
    display: none;
  }

  .stop-btn.active { display: block; }

  .result-box {
    background: var(--surface2);
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: 10px;
    display: none;
  }

  .result-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .result-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    word-break: break-all;
  }

  .apply-btn {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    background: rgba(79,142,247,0.12);
    border: 1px solid rgba(79,142,247,0.3);
    border-radius: 8px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s;
    display: none;
  }

  .apply-btn:hover { background: rgba(79,142,247,0.22); }
  .apply-btn:active { transform: scale(0.97); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fg { display: flex; flex-direction: column; gap: 5px; }
  .fg.full { grid-column: 1 / -1; }
  .fg label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }

  .fg input,
  .fg textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .fg input:focus,
  .fg textarea:focus { border-color: var(--accent); }

  .fg textarea { resize: none; height: 56px; }

  #f_order {
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }

  .btn-row { display: flex; gap: 10px; margin-top: 14px; }

  .btn {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:active { transform: scale(0.97); background: #3a7ae0; }
  .btn-ghost { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:active { transform: scale(0.97); }

  .tbl-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .tbl-title { font-size: 13px; font-weight: 700; }

  .export-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--accent2);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s;
  }

  .export-btn:active { transform: scale(0.96); }
  .tbl-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }

  thead th {
    background: var(--surface2);
    padding: 9px 10px;
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    text-align: left;
    white-space: nowrap;
  }

  tbody tr { border-top: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 8px 10px; font-size: 12px; vertical-align: middle; }

  .c-num { color: var(--muted); font-size: 10px; font-family: 'JetBrains Mono', monospace; }
  .c-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .c-order { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); }
  .c-product { color: var(--text); max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-qty { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--accent2); text-align: center; }
  .c-pic { color: var(--text); font-weight: 500; }
  .c-remark { color: var(--muted); font-size: 11px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 5px;
    transition: all 0.15s;
  }

  .del-btn:hover { color: var(--red); background: rgba(247,111,111,0.1); }

  .empty-state { text-align: center; padding: 32px 0; color: var(--muted); font-size: 12px; }
  .empty-icon { font-size: 28px; margin-bottom: 8px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--green);
    color: #0f1117;
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 700;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  @keyframes rowFlash {
    0% { background: rgba(79,142,247,0.2); }
    100% { background: transparent; }
  }

  .flash { animation: rowFlash 0.9s ease-out; }
</style>
</head>

<body>
  <div class="header">
    <div class="header-icon">📦</div>
    <div>
      <h1>電商退貨管理系統</h1>
      <div class="sub">RETURN MANAGEMENT · SHOPEE</div>
    </div>
    <div class="header-stats">
      <div class="stat-num" id="totalCount">0</div>
      <div class="stat-label">總筆數</div>
    </div>
  </div>

  <div class="card card-top-bar">
    <div class="card-title"><div class="live-dot"></div>掃描 QR 碼取得訂單編號</div>

    <button class="scan-btn" id="scanBtn" onclick="startScan()">
      <span class="scan-btn-icon">📷</span>
      開啟鏡頭掃描 QR 碼
    </button>

    <div class="camera-wrap" id="cameraWrap">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="canvas"></canvas>
      <div class="scan-overlay">
        <div class="scan-frame">
          <div class="scan-line"></div>
        </div>
      </div>
      <div class="scan-hint">將 QR 碼對準框內</div>
    </div>

    <button class="stop-btn" id="stopBtn" onclick="stopScan()">✕ 停止掃描</button>

    <div class="result-box" id="resultBox">
      <div class="result-label">掃描結果</div>
      <div class="result-value" id="resultValue"></div>
    </div>

    <button class="apply-btn" id="applyBtn" onclick="applyOrder()">✅ 帶入訂單編號</button>
  </div>

  <div class="card">
    <div class="card-title">填寫退貨資料</div>
    <div class="form-grid">
      <div class="fg full">
        <label>訂單編號</label>
        <input type="text" id="f_order" placeholder="掃描自動帶入，或手動輸入" autocomplete="off" />
      </div>
      <div class="fg full">
        <label>商品名稱</label>
        <input type="text" id="f_product" placeholder="商品名稱" autocomplete="off" />
      </div>
      <div class="fg">
        <label>數量</label>
        <input type="number" id="f_qty" min="1" value="1" />
      </div>
      <div class="fg">
        <label>負責人</label>
        <input type="text" id="f_pic" placeholder="姓名" autocomplete="off" />
      </div>
      <div class="fg">
        <label>日期</label>
        <input type="date" id="f_date" />
      </div>
      <div class="fg full">
        <label>備註</label>
        <textarea id="f_remark" placeholder="退貨原因、狀況說明..."></textarea>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="clearForm()">清除</button>
      <button class="btn btn-primary" onclick="addRecord()">＋ 新增紀錄</button>
    </div>
  </div>

  <div>
    <div class="tbl-header">
      <div class="tbl-title">退貨紀錄列表</div>
      <button class="export-btn" onclick="exportCSV()">⬇ 匯出 CSV</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>日期</th>
            <th>訂單編號</th>
            <th>商品名稱</th>
            <th style="text-align:center">數量</th>
            <th>負責人</th>
            <th>備註</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="8">
              <div class="empty-state"><div class="empty-icon">📋</div>尚無退貨紀錄</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  let records = JSON.parse(localStorage.getItem('rtn_v5') || '[]');
  let extractedOrder = '';
  let videoStream = null;
  let scanInterval = null;

  function todayStr() {
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  document.getElementById('f_date').value = todayStr();
  renderTable();

  async function startScan() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast('❌ 此瀏覽器不支援相機掃描', '#f76f6f', '#fff');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });
      videoStream = stream;
      const video = document.getElementById('video');
      video.srcObject = stream;
      await video.play();

      document.getElementById('scanBtn').style.display = 'none';
      document.getElementById('cameraWrap').classList.add('active');
      document.getElementById('stopBtn').classList.add('active');
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('applyBtn').style.display = 'none';

      clearInterval(scanInterval);
      scanInterval = setInterval(scanFrame, 250);
    } catch (err) {
      showToast('❌ 無法開啟鏡頭，請用 Safari 開啟並允許相機權限', '#f76f6f', '#fff');
    }
  }

  function scanFrame() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    if (!video || video.readyState !== video.HAVE_ENOUGH_DATA) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: 'attemptBoth'
    });

    if (code && code.data) {
      const raw = code.data.trim();
      const orderId = extractOrderId(raw);
      if (!orderId) {
        showToast('⚠️ 有掃到 QR，但無法判斷訂單編號', '#f7c94f', '#0f1117');
        return;
      }
      extractedOrder = orderId;
      document.getElementById('resultValue').textContent = orderId;
      document.getElementById('resultBox').style.display = 'block';
      document.getElementById('applyBtn').style.display = 'block';
      stopScan();
      showToast('✅ 掃描成功');
    }
  }

  function extractOrderId(raw) {
    let text = String(raw || '').trim();
    try {
      if (/^https?:\/\//i.test(text)) {
        const url = new URL(text);
        const params = ['order_sn', 'orderId', 'order_id', 'ordersn', 'sn'];
        for (const key of params) {
          const val = url.searchParams.get(key);
          if (val) return cleanOrderId(val);
        }
        const paths = url.pathname.split('/').filter(Boolean);
        if (paths.length) text = paths[paths.length - 1];
      }
    } catch (e) {}
    return cleanOrderId(text);
  }

  function cleanOrderId(value) {
    return String(value || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  }

  function stopScan() {
    clearInterval(scanInterval);
    scanInterval = null;
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
    const video = document.getElementById('video');
    if (video) video.srcObject = null;
    document.getElementById('cameraWrap').classList.remove('active');
    document.getElementById('stopBtn').classList.remove('active');
    document.getElementById('scanBtn').style.display = 'flex';
  }

  function applyOrder() {
    if (!extractedOrder) return;
    document.getElementById('f_order').value = extractedOrder;
    document.getElementById('f_product').focus();
    showToast('✅ 訂單編號已帶入');
  }

  function addRecord() {
    const order   = document.getElementById('f_order').value.trim().toUpperCase();
    const product = document.getElementById('f_product').value.trim();
    const qty     = Number(document.getElementById('f_qty').value || 1);
    const pic     = document.getElementById('f_pic').value.trim();
    const date    = document.getElementById('f_date').value || todayStr();
    const remark  = document.getElementById('f_remark').value.trim();

    if (!order)        { showToast('⚠️ 請填寫訂單編號', '#f7c94f', '#0f1117'); return; }
    if (!product)      { showToast('⚠️ 請填寫商品名稱', '#f7c94f', '#0f1117'); return; }
    if (!qty || qty<1) { showToast('⚠️ 數量需大於 0',   '#f7c94f', '#0f1117'); return; }

    const record = { id: Date.now(), order, product, qty, pic, date, remark };
    records.unshift(record);
    save();
    renderTable(record.id);

    document.getElementById('f_product').value = '';
    document.getElementById('f_qty').value = '1';
    document.getElementById('f_remark').value = '';
    document.getElementById('f_product').focus();
    showToast('✅ 已新增');
  }

  function clearForm() {
    ['f_order','f_product','f_pic','f_remark'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f_qty').value = '1';
    document.getElementById('f_date').value = todayStr();
    extractedOrder = '';
    document.getElementById('applyBtn').style.display = 'none';
    document.getElementById('resultBox').style.display = 'none';
  }

  function deleteRecord(id) {
    if (!confirm('確定刪除這筆退貨紀錄？')) return;
    records = records.filter(r => r.id !== id);
    save();
    renderTable();
    showToast('🗑️ 已刪除');
  }

  function save() { localStorage.setItem('rtn_v5', JSON.stringify(records)); }

  function esc(value) {
    return String(value ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  function renderTable(flashId) {
    document.getElementById('totalCount').textContent = records.length;
    const tbody = document.getElementById('tableBody');
    if (!records.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📋</div>尚無退貨紀錄</div></td></tr>`;
      return;
    }
    tbody.innerHTML = records.map((r, i) => `
      <tr ${r.id === flashId ? 'class="flash"' : ''}>
        <td class="c-num">${records.length - i}</td>
        <td class="c-date">${esc(r.date||'—')}</td>
        <td class="c-order">${esc(r.order)}</td>
        <td class="c-product" title="${esc(r.product)}">${esc(r.product||'—')}</td>
        <td class="c-qty">${esc(r.qty)}</td>
        <td class="c-pic">${esc(r.pic||'—')}</td>
        <td class="c-remark" title="${esc(r.remark)}">${esc(r.remark||'—')}</td>
        <td><button class="del-btn" onclick="deleteRecord(${r.id})">✕</button></td>
      </tr>`).join('');
  }

  function csvCell(value) {
    return '="' + String(value ?? '').replace(/"/g,'""') + '"';
  }

  function exportCSV() {
    if (!records.length) { showToast('⚠️ 沒有資料', '#f7c94f', '#0f1117'); return; }
    const header = ['#','日期','訂單編號','商品名稱','數量','負責人','備註'];
    const rows = records.map((r,i) => [records.length-i, r.date, r.order, r.product, r.qty, r.pic, r.remark]);
    const csv = '\uFEFF' + [header,...rows].map(row => row.map(csvCell).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `退貨紀錄_${todayStr()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    showToast('⬇ CSV 已匯出');
  }

  function showToast(msg, bg='var(--green)', color='#0f1117') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.background = bg; t.style.color = color;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  document.querySelectorAll('input[type="text"], input[type="number"]').forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') addRecord(); });
  });
</script>

</body>
</html>
