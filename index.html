<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>電商退貨管理系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js">
// 一打開網頁就嘗試開啟相機／詢問相機權限
document.addEventListener("DOMContentLoaded", async () => {
  setTimeout(async () => {
    try {
      await startScan();
    } catch (e) {
      console.log("自動開啟相機失敗，可能需要手動點擊。", e);
    }
  }, 500);
});

</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;--accent:#4f8ef7;--accent2:#f7c94f;--green:#3ecf8e;--red:#f76f6f;--text:#e8eaf6;--muted:#7c82a3;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:20px 16px 70px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.header-icon{width:42px;height:42px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.header h1{font-size:17px;font-weight:900}.sub{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px}.header-stats{margin-left:auto;text-align:right}.stat-num{font-size:24px;font-weight:900;color:var(--accent);font-family:'JetBrains Mono',monospace;line-height:1}.stat-label{font-size:10px;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;position:relative;overflow:hidden}.card-top-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;display:flex;align-items:center;gap:6px}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.5;transform:scale(.8)}}
.scan-btn,.stop-btn,.apply-btn,.photo-btn,.btn,.export-btn{font-family:'Noto Sans TC',sans-serif;cursor:pointer}.scan-btn{width:100%;padding:16px;border-radius:12px;background:linear-gradient(135deg,rgba(79,142,247,.15),rgba(79,142,247,.05));border:2px dashed rgba(79,142,247,.4);color:var(--accent);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.camera-wrap{display:none;position:relative;border-radius:12px;overflow:hidden;background:#000;width:100%;aspect-ratio:4/3;margin-bottom:10px}.camera-wrap.active{display:block}#video{width:100%;height:100%;object-fit:cover;display:block}#canvas{display:none}
.scan-overlay{position:absolute;inset:0;pointer-events:none}.scan-frame{position:absolute;left:50%;top:50%;width:68%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid var(--accent);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}.scan-line{position:absolute;left:8px;right:8px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scanline 2s linear infinite}@keyframes scanline{0%{top:8px}100%{top:calc(100% - 8px)}}.scan-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.82);font-weight:700}
.stop-btn{width:100%;padding:10px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:700;margin-bottom:10px;display:none}.stop-btn.active{display:block}.result-box{background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:10px;display:none}.result-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em}.result-value{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);font-weight:700;word-break:break-all;margin-top:4px}.apply-btn{margin-top:10px;width:100%;padding:10px;background:rgba(79,142,247,.12);border:1px solid rgba(79,142,247,.3);border-radius:8px;color:var(--accent);font-size:12px;font-weight:700;display:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg{display:flex;flex-direction:column;gap:5px}.fg.full{grid-column:1/-1}.fg label{font-size:11px;font-weight:700;color:var(--muted)}.fg input,.fg textarea,.fg select{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:13px;color:var(--text);outline:none;width:100%;font-family:'Noto Sans TC',sans-serif}.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--accent)}.fg textarea{resize:none;height:58px}#f_order{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12px}
.photo-actions{display:flex;gap:8px}.photo-btn{flex:1;padding:10px;border-radius:8px;border:1px dashed var(--border);background:var(--bg);color:var(--muted);font-size:12px;font-weight:700}.photo-preview-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photo-thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}.photo-thumb img{width:100%;height:100%;object-fit:cover}.photo-thumb-del{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff}
.btn-row{display:flex;gap:10px;margin-top:14px}.btn{flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:900;border:none}.btn-primary{background:var(--accent);color:#fff}.btn-ghost{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.tbl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.tbl-title{font-size:13px;font-weight:900}.export-btn{background:var(--surface2);border:1px solid var(--border);color:var(--accent2);padding:7px 12px;border-radius:8px;font-size:11px;font-weight:900}.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}table{width:100%;border-collapse:collapse;min-width:760px}thead th{background:var(--surface2);padding:9px 10px;font-size:10px;font-weight:900;color:var(--muted);text-align:left;white-space:nowrap}tbody tr{border-top:1px solid var(--border)}tbody td{padding:8px 10px;font-size:12px;vertical-align:middle}.c-order{font-family:'JetBrains Mono',monospace;color:var(--accent);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.c-date{font-family:'JetBrains Mono',monospace;color:var(--muted);white-space:nowrap}.c-qty{font-family:'JetBrains Mono',monospace;font-weight:900;color:var(--accent2);text-align:center}.c-small{color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.thumb-mini{width:28px;height:28px;border-radius:4px;object-fit:cover;border:1px solid var(--border);margin-right:3px;vertical-align:middle}.del-btn{background:none;border:0;color:var(--muted);font-size:15px;padding:3px 7px;cursor:pointer}.del-btn:hover{color:var(--red)}.empty-state{text-align:center;padding:32px 0;color:var(--muted);font-size:12px}.empty-icon{font-size:28px;margin-bottom:8px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--green);color:#0f1117;padding:10px 20px;border-radius:50px;font-size:13px;font-weight:900;transition:.28s;z-index:999;white-space:nowrap}.toast.show{transform:translateX(-50%) translateY(0)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:998;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal img{max-width:100%;max-height:82vh;border-radius:12px}.modal-close{position:absolute;top:18px;right:20px;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:26px;width:42px;height:42px;border-radius:50%;cursor:pointer}
@media(max-width:520px){body{padding:14px 10px 60px}.form-grid{grid-template-columns:1fr}.fg{grid-column:1/-1}.header h1{font-size:16px}.card{padding:14px}}
</style>
</head>
<body>
<div class="header"><div class="header-icon">📦</div><div><h1>電商退貨管理系統</h1><div class="sub">RETURN MANAGEMENT · SHOPEE</div></div><div class="header-stats"><div class="stat-num" id="totalCount">0</div><div class="stat-label">總筆數</div></div></div>

<div class="card card-top-bar"><div class="card-title"><div class="live-dot"></div>掃描 QR 碼取得訂單編號</div><button class="scan-btn" id="scanBtn" onclick="startScan()">📷 開啟相機鏡頭</button><div class="camera-wrap" id="cameraWrap"><video id="video" playsinline autoplay muted></video><canvas id="canvas"></canvas><div class="scan-overlay"><div class="scan-frame"><div class="scan-line"></div></div></div><div class="scan-hint">將 QR 碼對準框內，掃到後會自動停止</div></div><button class="stop-btn" id="stopBtn" onclick="stopScan()">✕ 停止掃描</button><div class="result-box" id="resultBox"><div class="result-label">掃描結果</div><div class="result-value" id="resultValue"></div></div><button class="apply-btn" id="applyBtn" onclick="applyOrder()">✅ 帶入訂單編號</button></div>

<div class="card"><div class="card-title">填寫退貨資料</div><div class="form-grid">
<div class="fg full"><label>訂單編號</label><input type="text" id="f_order" placeholder="掃描自動帶入，或手動輸入" autocomplete="off"></div>
<div class="fg full"><label>商品名稱</label><input type="text" id="f_product" placeholder="商品名稱" autocomplete="off"></div>
<div class="fg"><label>數量</label><input type="number" id="f_qty" min="1" value="1"></div>
<div class="fg"><label>單位</label><select id="f_unit"><option>包</option><option>箱</option><option>個</option><option>袋</option><option>組</option></select></div>
<div class="fg"><label>負責人</label><input type="text" id="f_pic" placeholder="姓名" autocomplete="off"></div>
<div class="fg"><label>日期</label><input type="date" id="f_date"></div>
<div class="fg full"><label>備註</label><textarea id="f_remark" placeholder="退貨原因、狀況說明..."></textarea></div>
<div class="fg full"><label>附件照片（可多張）</label><input id="photoInput" type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="handlePhotos(event)"><div class="photo-actions"><button class="photo-btn" type="button" onclick="document.getElementById('photoInput').click()">📷 拍照 / 從相簿選取</button><button class="photo-btn" type="button" onclick="clearPhotos()">清除全部</button></div><div class="photo-preview-wrap" id="photoPreview"></div></div>
</div><div class="btn-row"><button class="btn btn-ghost" onclick="clearForm()">清除</button><button class="btn btn-primary" onclick="addRecord()">＋ 新增商品</button></div></div>

<div><div class="tbl-header"><div class="tbl-title">退貨紀錄列表</div><button class="export-btn" onclick="exportCSV()">⬇ 匯出 CSV</button></div><div class="tbl-wrap"><table><thead><tr><th>#</th><th>日期</th><th>訂單編號</th><th>商品名稱</th><th>數量</th><th>單位</th><th>負責人</th><th>備註</th><th>照片</th><th></th></tr></thead><tbody id="tableBody"></tbody></table></div></div>
<div class="toast" id="toast"></div><div class="modal" id="photoModal" onclick="closePhotoModal()"><button class="modal-close" onclick="closePhotoModal()">×</button><img id="modalImg"></div>

<script>
let records=JSON.parse(localStorage.getItem('rtn_v10')||'[]');let extractedOrder='',videoStream=null,scanInterval=null,scanningLocked=false,pendingPhotos=[];
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}document.getElementById('f_date').value=todayStr();renderTable();
async function startScan(){if(scanningLocked)return;if(!window.isSecureContext){showToast('❌ 請用 https 網址開啟','#f76f6f','#fff');return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showToast('❌ 此瀏覽器不支援相機','#f76f6f','#fff');return}try{scanningLocked=false;const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});videoStream=stream;const video=document.getElementById('video');video.srcObject=stream;await video.play();document.getElementById('scanBtn').style.display='none';document.getElementById('cameraWrap').classList.add('active');document.getElementById('stopBtn').classList.add('active');document.getElementById('resultBox').style.display='none';document.getElementById('applyBtn').style.display='none';clearInterval(scanInterval);scanInterval=setInterval(scanFrame,220)}catch(e){showToast('❌ 無法開啟鏡頭，請用 Safari 並允許相機權限','#f76f6f','#fff')}}
function scanFrame(){if(scanningLocked)return;const video=document.getElementById('video'),canvas=document.getElementById('canvas');if(!video||video.readyState!==video.HAVE_ENOUGH_DATA)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(video,0,0,canvas.width,canvas.height);const img=ctx.getImageData(0,0,canvas.width,canvas.height);const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});if(code&&code.data){scanningLocked=true;const orderId=extractOrderId(code.data.trim());if(!orderId){showToast('⚠️ 有掃到 QR，但無法判斷訂單編號','#f7c94f','#0f1117');scanningLocked=false;return}extractedOrder=orderId;document.getElementById('resultValue').textContent=orderId;document.getElementById('resultBox').style.display='block';document.getElementById('applyBtn').style.display='block';stopScan(false);showToast('✅ 掃描成功')}}
function extractOrderId(raw){let text=String(raw||'').trim();try{if(/^https?:\/\//i.test(text)){const url=new URL(text);const params=['order_sn','orderId','order_id','ordersn','sn','order'];for(const key of params){const val=url.searchParams.get(key);if(val)return cleanOrderId(val)}const paths=url.pathname.split('/').filter(Boolean);if(paths.length)text=paths[paths.length-1]}}catch(e){}const m=text.match(/[A-Za-z0-9]{8,}/);return cleanOrderId(m?m[0]:text)}
function cleanOrderId(v){return String(v||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase()}function stopScan(resetLock=true){clearInterval(scanInterval);scanInterval=null;if(videoStream){videoStream.getTracks().forEach(t=>t.stop());videoStream=null}const video=document.getElementById('video');if(video)video.srcObject=null;document.getElementById('cameraWrap').classList.remove('active');document.getElementById('stopBtn').classList.remove('active');document.getElementById('scanBtn').style.display='flex';if(resetLock)scanningLocked=false}
function applyOrder(){if(!extractedOrder)return;document.getElementById('f_order').value=extractedOrder;document.getElementById('f_product').focus();showToast('✅ 訂單編號已帶入')}
function handlePhotos(e){const files=[...e.target.files].slice(0,6);if(!files.length)return;let done=0;files.forEach(file=>{const reader=new FileReader();reader.onload=ev=>{pendingPhotos.push(ev.target.result);done++;if(done===files.length)renderPhotoPreview()};reader.readAsDataURL(file)});e.target.value=''}
function renderPhotoPreview(){document.getElementById('photoPreview').innerHTML=pendingPhotos.map((p,i)=>`<div class="photo-thumb"><img src="${p}" onclick="openPhoto('${p}')"><button class="photo-thumb-del" onclick="removePhoto(${i})">×</button></div>`).join('')}function removePhoto(i){pendingPhotos.splice(i,1);renderPhotoPreview()}function clearPhotos(){pendingPhotos=[];renderPhotoPreview()}function openPhoto(src){document.getElementById('modalImg').src=src;document.getElementById('photoModal').classList.add('show')}function closePhotoModal(){document.getElementById('photoModal').classList.remove('show')}
function addRecord(){const order=document.getElementById('f_order').value.trim().toUpperCase(),product=document.getElementById('f_product').value.trim(),qty=Number(document.getElementById('f_qty').value||1),unit=document.getElementById('f_unit').value,pic=document.getElementById('f_pic').value.trim(),date=document.getElementById('f_date').value||todayStr(),remark=document.getElementById('f_remark').value.trim();if(!order){showToast('⚠️ 請填寫訂單編號','#f7c94f','#0f1117');return}if(!product){showToast('⚠️ 請填寫商品名稱','#f7c94f','#0f1117');return}if(!qty||qty<1){showToast('⚠️ 數量需大於 0','#f7c94f','#0f1117');return}records.unshift({id:Date.now(),order,product,qty,unit,pic,date,remark,photos:[...pendingPhotos]});save();renderTable();document.getElementById('f_product').value='';document.getElementById('f_qty').value='1';document.getElementById('f_remark').value='';pendingPhotos=[];renderPhotoPreview();document.getElementById('f_product').focus();showToast('✅ 已新增')}
function clearForm(){['f_order','f_product','f_pic','f_remark'].forEach(id=>document.getElementById(id).value='');document.getElementById('f_qty').value='1';document.getElementById('f_unit').value='包';document.getElementById('f_date').value=todayStr();extractedOrder='';pendingPhotos=[];renderPhotoPreview();document.getElementById('applyBtn').style.display='none';document.getElementById('resultBox').style.display='none'}
function deleteRecord(id){if(!confirm('確定刪除這筆退貨紀錄？'))return;records=records.filter(r=>r.id!==id);save();renderTable();showToast('🗑️ 已刪除')}function save(){localStorage.setItem('rtn_v10',JSON.stringify(records))}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function renderTable(){document.getElementById('totalCount').textContent=records.length;const tbody=document.getElementById('tableBody');if(!records.length){tbody.innerHTML=`<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">📋</div>尚無退貨紀錄</div></td></tr>`;return}tbody.innerHTML=records.map((r,i)=>`<tr><td>${records.length-i}</td><td class="c-date">${esc(r.date||'—')}</td><td class="c-order" title="${esc(r.order)}">${esc(r.order)}</td><td class="c-small" title="${esc(r.product)}">${esc(r.product)}</td><td class="c-qty">${esc(r.qty)}</td><td>${esc(r.unit||'包')}</td><td>${esc(r.pic||'—')}</td><td class="c-small" title="${esc(r.remark)}">${esc(r.remark||'—')}</td><td>${(r.photos||[]).slice(0,3).map(p=>`<img class="thumb-mini" src="${p}" onclick="openPhoto('${p}')">`).join('')||'—'}</td><td><button class="del-btn" onclick="deleteRecord(${r.id})">✕</button></td></tr>`).join('')}
function csvCell(v){return '="'+String(v??'').replace(/"/g,'""')+'"'}function exportCSV(){if(!records.length){showToast('⚠️ 沒有資料','#f7c94f','#0f1117');return}const header=['#','日期','訂單編號','商品名稱','數量','單位','負責人','備註','照片數'];const rows=records.map((r,i)=>[records.length-i,r.date,r.order,r.product,r.qty,r.unit,r.pic,r.remark,(r.photos||[]).length]);const csv='\uFEFF'+[header,...rows].map(row=>row.map(csvCell).join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`退貨紀錄_${todayStr()}.csv`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);showToast('⬇ CSV 已匯出')}
function showToast(msg,bg='var(--green)',color='#0f1117'){const t=document.getElementById('toast');t.textContent=msg;t.style.background=bg;t.style.color=color;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2200)}document.querySelectorAll('input[type="text"],input[type="number"]').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')addRecord()}));

// 一打開網頁就嘗試開啟相機／詢問相機權限
document.addEventListener("DOMContentLoaded", async () => {
  setTimeout(async () => {
    try {
      await startScan();
    } catch (e) {
      console.log("自動開啟相機失敗，可能需要手動點擊。", e);
    }
  }, 500);
});

</script>
</body>
</html>
